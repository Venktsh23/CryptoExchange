apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: cryptoexchange
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: password
        resources:
          requests:
            memory: "256Mi"
            cpu:    "250m"
          limits:
            memory: "512Mi"
            cpu:    "500m"
        # Liveness probe — is postgres alive?
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 30
          periodSeconds:       10
          failureThreshold:    5
        # Readiness probe — is postgres ready for connections?
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "cryptoexchange"]
          initialDelaySeconds: 5
          periodSeconds:       5
          failureThreshold:    3
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        emptyDir: {}  # Use PersistentVolumeClaim in production
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: exchange
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP  # Internal only — not exposed outside cluster